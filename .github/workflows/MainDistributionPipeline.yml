#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries (DuckDB v2.0.0 stable)
    # extension-ci-tools has no v2.0.0 tag yet. Pinned to the extension-ci-tools submodule commit on the
    # v2.0-cyanoptera release branch; TODO: move to the v2.0.0 tag once it exists.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@b8d325c37e82160886579880707493bd358c0e62
    with:
      duckdb_version: v2.0.0
      ci_tools_version: b8d325c37e82160886579880707493bd358c0e62
      extension_name: mongo
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;"
      # ci-tools v2.0 builds Intel macOS only on request
      opt_in_archs: "osx_amd64"
      # Pull requests would otherwise build only linux_amd64 and windows_amd64
      reduced_ci_mode: disabled
      # Newer than the extension-ci-tools default: that baseline still has
      # mongo-c-driver 1.30.6, which fails to configure on CMake 4.4 (macos-15),
      # and its msys2 package URLs 404. This commit ships mongo-c-driver 2.3.1#2
      # with upstream cmake-4.4.patch (CDRIVER-6367).
      vcpkg_commit: 'f74a2eade17a628413746557d04db25ccf6e76f9'

  duckdb-next-build:
    name: Build extension binaries (DuckDB main)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: main
      ci_tools_version: main
      extension_name: mongo
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;"
      # Same pin as duckdb-stable-build (CMake 4.4 + current msys2 URLs).
      vcpkg_commit: 'f74a2eade17a628413746557d04db25ccf6e76f9'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@b8d325c37e82160886579880707493bd358c0e62
    with:
      duckdb_version: v2.0.0
      ci_tools_version: b8d325c37e82160886579880707493bd358c0e62
      extension_name: mongo
      # Tidy check disabled because it requires MongoDB C++ driver (vcpkg dependency).
      format_checks: 'format'
