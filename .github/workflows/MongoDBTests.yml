name: MongoDB Integration Tests
on: [push, pull_request, repository_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

jobs:
  linux-tests-mongodb:
    name: Run tests on Linux with MongoDB (${{ matrix.duckdb_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        duckdb_version: ['submodule', 'main']
        arch: ['linux_amd64']
        include:
          - arch: 'linux_amd64'
            vcpkg_triplet: 'x64-linux'

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      VCPKG_TARGET_TRIPLET: ${{ matrix.vcpkg_triplet }}
      GEN: Ninja

    steps:
    - name: Install required ubuntu packages
      run: |
        sudo apt-get update -y -qq
        sudo apt-get install -y -qq build-essential cmake ninja-build ccache python3 python3-pip
        pip3 install pymongo
        # Ensure ninja is available in the path vcpkg expects
        which ninja || (echo "ninja not found in PATH" && find /usr -name ninja 2>/dev/null || true)
        # Create symlink if ninja is in /usr/bin but vcpkg expects /usr/local/bin
        if [ -f /usr/bin/ninja ] && [ ! -f /usr/local/bin/ninja ]; then
          sudo mkdir -p /usr/local/bin
          sudo ln -sf /usr/bin/ninja /usr/local/bin/ninja
        fi
        # Verify ninja is accessible and executable
        /usr/local/bin/ninja --version || /usr/bin/ninja --version
        # Ensure ninja is executable
        sudo chmod +x /usr/bin/ninja
        [ -f /usr/local/bin/ninja ] && sudo chmod +x /usr/local/bin/ninja || true
        # Add ninja directories to PATH for vcpkg (GITHUB_PATH persists across steps)
        echo "/usr/bin" >> $GITHUB_PATH
        echo "/usr/local/bin" >> $GITHUB_PATH

    - name: Install mongosh
      run: |
        wget -qO- https://www.mongodb.org/static/pgp/server-7.0.asc | sudo tee /etc/apt/trusted.gpg.d/server-7.0.asc
        echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
        sudo apt-get update
        sudo apt-get install -y mongodb-mongosh

    - name: Test MongoDB connection
      run: |
        mongosh --host localhost:27017 --eval "db.runCommand({ping:1})"

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: 'true'

    - name: Checkout DuckDB to version
      if: ${{ matrix.duckdb_version != 'submodule' }}
      run: |
        cd duckdb
        git fetch origin ${{ matrix.duckdb_version }}
        git checkout ${{ matrix.duckdb_version }}
        echo "Switched DuckDB to $(git log --oneline -1)"

    - name: Setup Ccache
      uses: hendrikmuhs/ccache-action@main
      with:
        key: ${{ github.job }}-${{ matrix.duckdb_version }}
        save: ${{ github.ref == 'refs/heads/main' || github.repository != 'stephaniewang526/duckdb-mongo' }}

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11.1
      with:
        # Same pin as MainDistributionPipeline (mongo-c-driver 2.3.1#2 + cmake-4.4.patch).
        vcpkgGitCommitId: f74a2eade17a628413746557d04db25ccf6e76f9
      env:
        # Ensure ninja is available to vcpkg during setup
        PATH: /usr/bin:/usr/local/bin:$PATH
        CMAKE_MAKE_PROGRAM: /usr/bin/ninja

    - name: Build extension
      env:
        GEN: ninja
        VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
        CMAKE_MAKE_PROGRAM: /usr/bin/ninja
      run: |
        echo "VCPKG_TOOLCHAIN_PATH=$VCPKG_TOOLCHAIN_PATH"
        echo "VCPKG_TARGET_TRIPLET=$VCPKG_TARGET_TRIPLET"
        echo "CMAKE_MAKE_PROGRAM=$CMAKE_MAKE_PROGRAM"
        echo "ninja location: $(which ninja)"
        # Capture more detailed error output if build fails
        make release 2>&1 | tee build.log || (echo "=== Build failed, showing last 200 lines ===" && tail -200 build.log && exit 1)

    - name: Create MongoDB test data
      run: |
        set -e
        echo "Creating general test database..."
        bash test/create-mongo-tables.sh
        echo "Creating TPC-H test database (sf=0.01)..."
        bash test/create-tpch-test-db.sh
        echo "Verifying TPC-H test database was created..."
        mongosh --host localhost:27017 --eval "
          use tpch_test;
          const count = db.lineitem.countDocuments();
          if (count === 0) {
            print('ERROR: tpch_test.lineitem is empty!');
            quit(1);
          }
          print('✓ tpch_test.lineitem has ' + count + ' documents');
        "

    - name: Test extension
      env:
        MONGODB_TEST_DATABASE_AVAILABLE: 1
      run: |
        echo "Running all tests (ensuring no skips)..."
        make test_release 2>&1 | tee test.log
        # extension-ci-tools runs tests via duckdb/scripts/ci/run_tests.py, which ends with
        # "ran tests: N passed[, M failed], K skipped in Xs".
        SUMMARY=$(grep -E "ran tests: [0-9]+ passed" test.log | tail -1)
        if [ -z "$SUMMARY" ]; then
          echo "ERROR: Tests did not complete successfully (no summary line found)!"
          exit 1
        fi
        echo "Summary: $SUMMARY"
        PASSED=$(echo "$SUMMARY" | sed -n 's/.*ran tests: \([0-9]*\) passed.*/\1/p')
        FAILED=$(echo "$SUMMARY" | sed -n 's/.*, \([0-9]*\) failed.*/\1/p')
        SKIPPED=$(echo "$SUMMARY" | sed -n 's/.*, \([0-9]*\) skipped.*/\1/p')
        PARTIAL=$(echo "$SUMMARY" | sed -n 's/.*(\([0-9]*\) partially).*/\1/p')
        FAILED=${FAILED:-0}
        SKIPPED=${SKIPPED:-0}
        PARTIAL=${PARTIAL:-0}
        if [ "$FAILED" -ne "0" ]; then
          echo "ERROR: $FAILED test(s) failed!"
          exit 1
        fi
        if [ "$SKIPPED" -ne "0" ]; then
          echo "ERROR: $SKIPPED test(s) were skipped!"
          grep -A5 "Skipped tests" test.log || true
          exit 1
        fi
        if [ "$PARTIAL" -ne "0" ]; then
          echo "ERROR: $PARTIAL test(s) were partially skipped!"
          grep -A5 "Partially skipped tests" test.log || true
          exit 1
        fi
        EXPECTED=$(find test -name '*.test' | wc -l)
        if [ "$PASSED" -ne "$EXPECTED" ]; then
          echo "ERROR: Expected $EXPECTED tests to pass, but $PASSED did!"
          exit 1
        fi
        echo "All $PASSED tests executed successfully (no skips)"

    # The Atlas integration test needs a live Atlas cluster, so CI only checks that it still compiles
    - name: Compile Atlas integration test
      env:
        GEN: ninja
        VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
        CMAKE_MAKE_PROGRAM: /usr/bin/ninja
        EXT_FLAGS: -DMONGO_BUILD_ATLAS_INTEGRATION_TEST=ON
      run: make release
